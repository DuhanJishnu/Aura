<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shopper</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>Shopper</h1>
  <button id="speakBtn" class="ghost" aria-pressed="false" title="Read replies aloud" hidden>Speak replies: off</button>
  <button id="profileBtn" class="ghost">Profile</button>
  <button id="cartBtn" class="ghost" aria-controls="drawer">Cart <span id="cartCount">0</span></button>
</header>

<main class="layout">
  <section class="chat" aria-label="Chat">
    <div id="log" class="log" aria-live="polite"></div>
    <div class="chips" aria-label="Quick start">
      <button type="button" class="chip" data-q="I'm looking for shoes">Shoes</button>
      <button type="button" class="chip" data-q="I'm looking for clothes">Clothes</button>
      <button type="button" class="chip" data-q="I'm looking for accessories">Accessories</button>
    </div>
    <form id="composer" class="composer">
      <input id="input" autocomplete="off" maxlength="1000" placeholder="Tell me what you're looking for…" aria-label="Message">
      <button id="mic" type="button" class="ghost" aria-pressed="false" title="Speak (your browser's speech service hears the audio)" hidden>Mic</button>
      <button id="send" type="submit">Send</button>
    </form>
    <div id="voiceStatus" class="voice-status" role="status" aria-live="polite"></div>
  </section>

  <section class="panel" aria-label="Products">
    <div id="panel"></div>
  </section>
</main>

<aside id="drawer" class="drawer" hidden aria-label="Cart">
  <div class="drawer-head"><strong>Your cart</strong><button id="closeCart" class="ghost">Close</button></div>
  <div id="cartItems"></div>
  <div class="drawer-foot">
    <div>Total <strong id="cartTotal">₹0</strong></div>
    <button id="checkoutBtn" disabled>Place order</button>
  </div>
</aside>

<aside id="profileDrawer" class="drawer" hidden aria-label="Profile">
  <div class="drawer-head"><strong>Your profile</strong><button id="closeProfile" class="ghost">Close</button></div>
  <div id="profileBody"></div>
  <div class="drawer-foot col">
    <button id="photoBtn" class="ghost">Color advice from a photo</button>
    <button id="forgetBtn" class="ghost">Forget my profile</button>
  </div>
</aside>

<script src="util.js"></script>
<script src="app.js"></script>
</body>
</html>
