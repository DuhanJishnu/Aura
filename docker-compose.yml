services:
  api:
    build: .
    env_file: .env
    environment:
      TRUST_PROXY: "1"
    volumes:
      - stylist-profiles:/app/data/profiles
    ports: ["8000:8000"]
  web:
    build: ./web
    environment:
      BACKEND_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  stylist-profiles:
